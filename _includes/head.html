<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11110D" media="(prefers-color-scheme: dark)">
{%- if page.noindex %}
<meta name="robots" content="noindex">
{%- endif %}
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
{% seo %}
{% feed_meta %}
<link rel="preload" href="/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css?v={{ site.time | date: '%s' }}">
<link rel="icon" href="/favicon.svg?v={{ site.time | date: '%s' }}" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png?v={{ site.time | date: '%s' }}" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v={{ site.time | date: '%s' }}">
{%- if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}",
  "jobTitle": "Software Engineer",
  "worksFor": { "@type": "Organization", "name": "Wells Fargo" },
  "alumniOf": { "@type": "CollegeOrUniversity", "name": "Indian Institute of Technology Madras" },
  "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressCountry": "IN" },
  "sameAs": ["{{ site.github_url }}", "{{ site.linkedin_url }}"]
}
</script>
{%- endif %}
